name: Deploy worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build worker bundle
        run: python3 build.py

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 49f1f72b4dae679753d12e26aed81221
          command: deploy

      # Pushes the GitHub secret MODEL_API_KEY into the worker as a runtime
      # secret (GitHub secrets are NOT visible to the worker on their own).
      - name: Sync MODEL_API_KEY worker secret
        if: ${{ secrets.MODEL_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 49f1f72b4dae679753d12e26aed81221
        run: printf '%s' "${{ secrets.MODEL_API_KEY }}" | npx -y wrangler secret put MODEL_API_KEY
