<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrengthTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='14' width='28' height='4' rx='2' fill='%235eb1ff'/%3E%3Crect x='5' y='9' width='4' height='14' rx='1.5' fill='%235eb1ff'/%3E%3Crect x='23' y='9' width='4' height='14' rx='1.5' fill='%235eb1ff'/%3E%3C/svg%3E">
<style>
:root { --bg:#0f1115; --card:#171b22; --line:#262c36; --txt:#e8ecf1; --dim:#9aa4b2; --acc:#5eb1ff; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; z-index:10; background:#131720; border-bottom:1px solid var(--line); }
.hd { max-width:720px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:8px; }
.hd h1 { font-size:17px; margin:0; flex:1; }
.logo { width:24px; height:24px; flex:none; }
.hd a { color:var(--dim); text-decoration:none; font-size:13px; padding:6px 8px; border-radius:8px; }
.hd a.on { color:var(--txt); background:var(--card); }
#out { color:var(--dim); font-size:12px; background:none; border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer; }
main { max-width:720px; margin:0 auto; padding:12px 14px 60px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; }
.dim { color:var(--dim); }
.small { font-size:12.5px; }
a.wo { color:inherit; text-decoration:none; display:block; }
a.wo:active .card { background:#1c222c; }
.wdate { font-weight:600; font-size:15px; }
.wmeta { color:var(--dim); font-size:13px; margin-top:3px; }
.badge { display:inline-block; background:#22303f; color:var(--acc); border-radius:6px; padding:1px 7px; font-size:12px; margin-left:6px; }
.exname { font-weight:600; font-size:15px; margin:14px 0 6px; }
.setrow { display:flex; justify-content:space-between; padding:7px 2px; border-top:1px solid var(--line); font-size:14px; }
.setrow .n { color:var(--dim); width:44px; }
.setrow .v { flex:1; }
.setrow .F { color:#ff9d5c; font-weight:700; margin-left:6px; }
.tag { font-size:11px; background:#2a3340; border-radius:5px; padding:1px 6px; color:var(--dim); margin-right:6px; }
input[type=text], input[type=search] { width:100%; background:#0f1319; border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:10px 12px; font-size:15px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:7px 4px; border-top:1px solid var(--line); }
th { color:var(--dim); font-weight:500; border-top:none; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
svg.chart { width:100%; height:auto; display:block; }
button.go { background:var(--acc); color:#06121f; border:none; border-radius:10px; padding:9px 16px; font-size:15px; font-weight:600; cursor:pointer; }
.err { color:#ff8f8f; font-size:13px; margin-top:8px; }
.grphead { font-size:13px; font-weight:700; letter-spacing:1.5px; color:var(--dim); margin:18px 2px 8px; }
.exgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
a.exblock { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:inherit; text-decoration:none; display:block; }
a.exblock:active { background:#1c222c; }
.exblock .n { font-weight:600; font-size:14px; }
.exblock .m { color:var(--dim); font-size:12px; margin-top:3px; }
.lg { cursor:pointer; user-select:none; -webkit-user-select:none; margin-right:12px; }
.lg .lbl { font-size:12px; color:#9aa4b2; }
.lg.off { opacity:.35; }
.lg.off .lbl { text-decoration:line-through; }
.mini { cursor:pointer; color:var(--acc); user-select:none; -webkit-user-select:none; }
.seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; flex:none; }
.seg span { padding:5px 10px; cursor:pointer; color:var(--dim); user-select:none; -webkit-user-select:none; }
.seg span.on { background:var(--acc); color:#06121f; font-weight:600; }
</style>
</head>
<body>
<header><div class="hd">
<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="14" width="28" height="4" rx="2" fill="#5eb1ff"/><rect x="5" y="9" width="4" height="14" rx="1.5" fill="#5eb1ff"/><rect x="23" y="9" width="4" height="14" rx="1.5" fill="#5eb1ff"/><rect x="10" y="11.5" width="3" height="9" rx="1" fill="#9aa4b2"/><rect x="19" y="11.5" width="3" height="9" rx="1" fill="#9aa4b2"/></svg>
<h1>StrengthTrack</h1>
<a href="#/" data-nav>Exercises</a>
<a href="#/wo" data-nav>Workouts</a>
<a href="#/wt" data-nav>Body&nbsp;wt</a>
<a href="#/notes" data-nav>Notes</a>

</div></header>
<main><div id="view"></div></main>
<script src="/app.js"></script>
</body>
</html>
